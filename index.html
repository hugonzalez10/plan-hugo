<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Plan Hugo" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <title>Plan Hugo</title>
  <link rel="manifest" href="manifest.json" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    /* ────────────────────────────────────────────────────────────
       Plan Hugo · Bento theme — tokens (cambiar aquí mueve toda la app)
       ──────────────────────────────────────────────────────────── */
    :root {
      --bento-bg:        #f7f7f5;
      --bento-card:      #ffffff;
      --bento-ink:       #1a1c1f;
      --bento-on-ink:    #ffffff;
      --bento-muted:     #5a5d62;
      --bento-faint:     #8a8d92;
      --bento-hairline:  #ececea;
      --bento-surface:   #f0efea;
      --bento-pos:       #7a9a78;
      --bento-warm:      #cd7a55;
      --bento-yellow:    #d9a648;
      --bento-blue:      #5a8db5;
      --bento-lilac:     #8a7ab5;
      --bento-mint:      #9eddc0;
    }
    html.dark, .dark:root {
      --bento-bg:        #0c0d10;
      --bento-card:      #16181c;
      --bento-ink:       #fafafa;
      --bento-on-ink:    #0c0d10;
      --bento-muted:     #b0b4ba;
      --bento-faint:     #787e88;
      --bento-hairline:  #25272b;
      --bento-surface:   #1e2024;
    }

    html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
    body { background: var(--bento-bg); color: var(--bento-ink); }
    input[type="number"], input[type="text"] { font-size: 16px; }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 1rem); }
    .safe-top { padding-top: env(safe-area-inset-top); }

    /* Reusable bento helpers */
    .bento-card {
      background: var(--bento-card);
      border: 1px solid var(--bento-hairline);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .bento-mono { font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
    /* Números display: bold, tight, tabular (hero/stats/récords) */
    .bento-num { font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    /* Grids responsivos del rediseño Bento (1 col en móvil → 2/4 en ≥640px) */
    .bento-grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .bento-grid2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) {
      .bento-grid4 { grid-template-columns: repeat(4, 1fr); }
      .bento-grid2.is-a { grid-template-columns: 1.3fr 1fr; }
      .bento-grid2.is-b { grid-template-columns: 1.4fr 1fr; }
      .bento-grid2.is-eq { grid-template-columns: 1fr 1fr; }
    }
    .bento-label {
      font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', monospace;
      font-size: 11px; color: var(--bento-faint);
      letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500;
    }
    kbd {
      font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', monospace;
      font-size: 11px;
      background: var(--bento-surface);
      color: var(--bento-muted);
      padding: 1px 6px; border-radius: 4px;
    }

    /* ⌘K palette */
    .cmdk-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.42);
      backdrop-filter: blur(8px); z-index: 100;
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 12vh; animation: cmdkFade 140ms ease-out;
    }
    @keyframes cmdkFade { from { opacity: 0; } to { opacity: 1; } }
    .cmdk-modal {
      width: 560px; max-width: 92vw;
      background: var(--bento-card); border-radius: 14px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.32), 0 0 0 1px var(--bento-hairline);
      overflow: hidden; color: var(--bento-ink);
    }
    .cmdk-input {
      width: 100%; padding: 16px 20px; font-size: 16px; border: none;
      background: transparent; color: var(--bento-ink);
      outline: none; border-bottom: 1px solid var(--bento-hairline);
    }
    .cmdk-input::placeholder { color: var(--bento-faint); }
    .cmdk-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 18px; cursor: pointer; font-size: 13.5px;
      color: var(--bento-ink);
    }
    .cmdk-item[data-active="true"] { background: var(--bento-surface); }
    .cmdk-section {
      padding: 8px 18px 4px; font-size: 10px;
      font-family: ui-monospace, 'JetBrains Mono', monospace;
      color: var(--bento-faint);
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .cmdk-meta {
      margin-left: auto; font-family: ui-monospace, 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--bento-faint);
    }

    /* Screen transition */
    .screen-enter { animation: screenIn 180ms ease-out; }
    @keyframes screenIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* Push inner sticky elements (kcal progress panel) below the Bento top bar */
    .bento-app .sticky.top-0 { top: 64px; z-index: 19; }
    @media (max-width: 767px) {
      .bento-app .sticky.top-0 { top: 56px; }
    }
    /* Show/hide shell pieces by viewport */
    @media (min-width: 768px) {
      .bento-mobile-tabbar { display: none !important; }
      .bento-topbar-mobile { display: none !important; }
      .bento-app { padding-bottom: 0 !important; }
    }
    @media (max-width: 767px) {
      .bento-topbar-desktop { display: none !important; }
    }

    /* ────────────────────────────────────────────────────────────
       Bento compat — reviste las clases Tailwind existentes con los
       tokens bento, sin tocar el JSX de los 38 componentes.
       ──────────────────────────────────────────────────────────── */
    /* Tarjetas / fondos elevados */
    .bento-app .bg-white { background-color: var(--bento-card) !important; }
    .dark .bento-app .dark\:bg-gray-900 { background-color: var(--bento-card) !important; }
    .dark .bento-app .dark\:bg-gray-900\/95 { background-color: var(--bento-card) !important; }
    .dark .bento-app .dark\:bg-gray-900\/90 { background-color: var(--bento-card) !important; }
    /* Superficies hundidas (chips, inputs, fills) */
    .bento-app .bg-gray-50, .bento-app .bg-gray-100, .bento-app .bg-gray-200 { background-color: var(--bento-surface) !important; }
    .dark .bento-app .dark\:bg-gray-800,
    .dark .bento-app .dark\:bg-gray-800\/60,
    .dark .bento-app .dark\:bg-gray-800\/40,
    .dark .bento-app .dark\:bg-gray-950 { background-color: var(--bento-surface) !important; }
    /* Bordes → hairline */
    .bento-app .border-gray-100, .bento-app .border-gray-200, .bento-app .border-gray-300 { border-color: var(--bento-hairline) !important; }
    .dark .bento-app .dark\:border-gray-700, .dark .bento-app .dark\:border-gray-800 { border-color: var(--bento-hairline) !important; }
    /* Texto → tokens */
    .bento-app .text-gray-500, .bento-app .text-gray-400 { color: var(--bento-faint) !important; }
    .dark .bento-app .dark\:text-gray-400, .dark .bento-app .dark\:text-gray-500 { color: var(--bento-faint) !important; }
    .bento-app .text-gray-600, .bento-app .text-gray-700 { color: var(--bento-muted) !important; }
    .dark .bento-app .dark\:text-gray-300, .dark .bento-app .dark\:text-gray-200 { color: var(--bento-muted) !important; }
    .bento-app .text-gray-800, .bento-app .text-gray-900 { color: var(--bento-ink) !important; }
    .dark .bento-app .dark\:text-gray-100, .dark .bento-app .dark\:text-white { color: var(--bento-ink) !important; }
    /* Cards con rounded-2xl: sombra bento sutil + radio consistente */
    .bento-app .rounded-2xl { border-radius: 16px; }
    .bento-app .rounded-3xl { border-radius: 20px; }

    /* ────────────────────────────────────────────────────────────
       Bento accent retint — mapea los colores Tailwind (emerald/sky/
       rose/amber/violet) a los tokens bento. Antes solo se revestían
       los grises, por eso la pestaña Ejercicios se veía verde/azul
       neón. Esto unifica botones, barras, heatmap y textos de toda
       la app sin tocar el JSX.
       · emerald (primario + éxito)  → ink / sage
       · sky (volumen/info)          → blue
       · rose·red (peligro)          → warm
       · amber·orange (aviso)        → yellow / warm
       · violet                      → lilac
       ──────────────────────────────────────────────────────────── */
    /* accent bg */
    .bento-app [class~="bg-emerald-500"],
    .bento-app [class~="bg-emerald-600"],
    .bento-app [class~="bg-emerald-500/80"] {
      background-color: var(--bento-ink) !important;
    }
    .bento-app [class~="bg-emerald-100"],
    .bento-app [class~="dark:bg-emerald-900/30"],
    .bento-app [class~="bg-emerald-50"],
    .bento-app [class~="dark:bg-emerald-900/20"],
    .bento-app [class~="bg-emerald-50/40"],
    .bento-app [class~="dark:bg-emerald-900/10"],
    .bento-app [class~="bg-emerald-900/30"],
    .bento-app [class~="bg-emerald-900/20"],
    .bento-app [class~="dark:bg-emerald-900/40"] {
      background-color: rgba(122,154,120,0.12) !important;
    }
    .bento-app [class~="bg-amber-500"],
    .bento-app [class~="bg-amber-600"] {
      background-color: var(--bento-yellow) !important;
    }
    .bento-app [class~="bg-amber-100"],
    .bento-app [class~="dark:bg-amber-900/30"],
    .bento-app [class~="bg-amber-50"],
    .bento-app [class~="bg-orange-50"],
    .bento-app [class~="dark:bg-orange-900/30"],
    .bento-app [class~="dark:bg-amber-900/20"] {
      background-color: rgba(217,166,72,0.12) !important;
    }
    .bento-app [class~="bg-rose-500"],
    .bento-app [class~="bg-red-500"] {
      background-color: var(--bento-warm) !important;
    }
    .bento-app [class~="bg-rose-100"],
    .bento-app [class~="dark:bg-rose-900/30"],
    .bento-app [class~="bg-rose-50"],
    .bento-app [class~="bg-rose-900/50"],
    .bento-app [class~="bg-rose-200"],
    .bento-app [class~="bg-rose-900/20"],
    .bento-app [class~="dark:bg-rose-900/20"],
    .bento-app [class~="bg-red-50"],
    .bento-app [class~="dark:bg-red-900/30"] {
      background-color: rgba(205,122,85,0.10) !important;
    }
    .bento-app [class~="bg-sky-100"],
    .bento-app [class~="dark:bg-sky-900/30"],
    .bento-app [class~="bg-sky-200"],
    .bento-app [class~="bg-sky-900/50"],
    .bento-app [class~="bg-sky-50"],
    .bento-app [class~="dark:bg-sky-900/20"] {
      background-color: rgba(90,141,181,0.12) !important;
    }
    .bento-app [class~="bg-sky-500"],
    .bento-app [class~="bg-sky-500/80"] {
      background-color: var(--bento-blue) !important;
    }
    .bento-app [class~="bg-violet-500"],
    .bento-app [class~="bg-violet-600"] {
      background-color: var(--bento-lilac) !important;
    }
    /* accent text */
    .bento-app [class~="text-emerald-700"],
    .bento-app [class~="dark:text-emerald-300"],
    .bento-app [class~="text-emerald-600"],
    .bento-app [class~="dark:text-emerald-400"],
    .bento-app [class~="text-emerald-800"],
    .bento-app [class~="dark:text-emerald-200"],
    .bento-app [class~="text-emerald-400"],
    .bento-app [class~="text-emerald-300"] {
      color: var(--bento-pos) !important;
    }
    .bento-app [class~="text-amber-700"],
    .bento-app [class~="dark:text-amber-300"],
    .bento-app [class~="text-rose-700"],
    .bento-app [class~="dark:text-rose-300"],
    .bento-app [class~="text-rose-600"],
    .bento-app [class~="text-amber-800"],
    .bento-app [class~="dark:text-amber-200"],
    .bento-app [class~="text-orange-700"],
    .bento-app [class~="dark:text-orange-300"],
    .bento-app [class~="text-orange-800"],
    .bento-app [class~="dark:text-orange-200"],
    .bento-app [class~="text-amber-900"],
    .bento-app [class~="dark:text-amber-100"],
    .bento-app [class~="dark:text-rose-400"],
    .bento-app [class~="text-rose-400"],
    .bento-app [class~="text-rose-800"],
    .bento-app [class~="dark:text-rose-200"],
    .bento-app [class~="text-amber-600"],
    .bento-app [class~="dark:text-amber-400"],
    .bento-app [class~="text-amber-500"],
    .bento-app [class~="text-rose-500"],
    .bento-app [class~="text-red-700"],
    .bento-app [class~="dark:text-red-300"] {
      color: var(--bento-warm) !important;
    }
    .bento-app [class~="text-sky-700"],
    .bento-app [class~="dark:text-sky-300"],
    .bento-app [class~="text-sky-900"],
    .bento-app [class~="dark:text-sky-100"],
    .bento-app [class~="text-sky-600"],
    .bento-app [class~="dark:text-sky-400"],
    .bento-app [class~="text-sky-500"] {
      color: var(--bento-blue) !important;
    }
    /* accent border */
    .bento-app [class~="border-emerald-500"],
    .bento-app [class~="border-emerald-200"],
    .bento-app [class~="dark:border-emerald-800"],
    .bento-app [class~="border-emerald-400"],
    .bento-app [class~="border-emerald-300"],
    .bento-app [class~="dark:border-emerald-700"],
    .bento-app [class~="border-emerald-700"],
    .bento-app [class~="dark:border-emerald-900/50"],
    .bento-app [class~="dark:border-emerald-600"] {
      border-color: var(--bento-pos) !important;
    }
    .bento-app [class~="border-amber-200"],
    .bento-app [class~="dark:border-amber-800"],
    .bento-app [class~="border-amber-300"],
    .bento-app [class~="dark:border-amber-700"],
    .bento-app [class~="dark:border-amber-900/50"] {
      border-color: var(--bento-yellow) !important;
    }
    .bento-app [class~="border-rose-300"],
    .bento-app [class~="dark:border-rose-700"],
    .bento-app [class~="border-rose-200"],
    .bento-app [class~="dark:border-rose-900/50"],
    .bento-app [class~="border-red-200"],
    .bento-app [class~="dark:border-red-800"] {
      border-color: var(--bento-warm) !important;
    }
    /* texto blanco sobre rellenos que se mapean a ink (se invierten en
       dark) → usar on-ink para que el botón "Subir captura"/CTA quede
       legible igual que "+ Comida" */
    .bento-app [class~="bg-emerald-500"][class~="text-white"],
    .bento-app [class~="bg-emerald-600"][class~="text-white"],
    .bento-app [class~="bg-emerald-500/80"][class~="text-white"] {
      color: var(--bento-on-ink) !important;
  </style>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
    integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
    integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans">
  <div id="root"></div>

  <!-- jsPDF (PDF de la evaluación) y mammoth (.docx de la rutina) ya NO se cargan aquí: pesan
       ~250 KB y son features puntuales. app.jsx los inyecta bajo demanda con loadScript() la
       primera vez que se usan; el SW (cache-first en unpkg) los conserva offline tras ese uso. -->
  <script src="app.js" defer></script>
</body>
</html>
